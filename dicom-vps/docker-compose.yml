# ============================================================
# GARVIS — DICOM en VPS (/root/dicom)
#
# Uso:  docker compose up -d
#
# Express API debe usar: ORTHANC_URL=http://127.0.0.1:8088/orthanc
# (Orthanc no expone 8042 al host, se accede vía gateway)
# ============================================================

services:
  orthanc:
    image: orthancteam/orthanc:latest
    container_name: orthanc
    restart: unless-stopped
    ports:
      - "4242:4242"
    volumes:
      - orthanc-db:/var/lib/orthanc/db
      - ./orthanc.json:/etc/orthanc/orthanc.json:ro

  ohif:
    image: ohif/app:v3.12.0
    container_name: ohif
    restart: unless-stopped
    environment:
      APP_CONFIG: /usr/share/nginx/html/app-config.js
    volumes:
      - ./ohif-app-config.js:/usr/share/nginx/html/app-config.js:ro
    depends_on:
      - orthanc

  gateway:
    image: nginx:alpine
    container_name: dicom-gateway
    restart: unless-stopped
    ports:
      - "8088:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - orthanc
      - ohif

volumes:
  orthanc-db:
