server {
  listen 80;

  include /etc/nginx/mime.types;
  types { application/javascript js mjs; }

  client_max_body_size 2g;

  # OHIF (SPA) — permitir iframe desde garbis.online
  location / {
    proxy_pass http://ohif:80/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Content-Security-Policy "frame-ancestors https://garbis.online https://*.garbis.online 'self'" always;
  }

  # Orthanc REST (Express lo usa para uploads, descargas, etc.)
  location ^~ /orthanc/ {
    proxy_pass http://orthanc:8042/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Authorization $http_authorization;
    proxy_pass_request_headers on;
    proxy_read_timeout 300s;
    client_max_body_size 2g;
  }

  # DICOMweb (QIDO/WADO-RS/STOW)
  # Inyectamos credenciales Orthanc para que OHIF cargue imágenes sin pedir login al usuario.
  # /orthanc/ sigue pidiendo clave (UI, Express). Solo /dicom-web/ pasa auth automática.
  location ^~ /dicom-web/ {
    proxy_pass http://orthanc:8042/dicom-web/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Authorization "Basic YWRtaW46enVsZmExMjM0NQ==";

    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, Origin, User-Agent, DNT, Cache-Control, X-Requested-With" always;

    if ($request_method = OPTIONS) { return 204; }
  }
}
