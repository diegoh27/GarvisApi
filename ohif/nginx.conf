server {
  # ── Configuración original OHIF (no modificar) ──────────────
  gzip_static  always;
  gzip_proxied expired no-cache no-store private auth;
  gunzip       on;
  listen 80 default_server;
  listen [::]:80 default_server;

  # ── app-config.js: nunca servir el .gz del contenedor ───────
  # (aquí montamos nuestro config personalizado sin comprimir)
  location = /app-config.js {
    root  /usr/share/nginx/html;
    gzip_static off;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    try_files $uri =404;
  }

  # ── DICOMweb proxy → Orthanc ─────────────────────────────────
  location /dicom-web/ {
    proxy_pass http://orthanc:8042/dicom-web/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_connect_timeout 10s;
    client_max_body_size 2g;

    add_header Access-Control-Allow-Origin * always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, Range" always;
    add_header Access-Control-Expose-Headers "Content-Length, Content-Range" always;

    if ($request_method = 'OPTIONS') {
      add_header Access-Control-Allow-Origin * always;
      add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
      add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, Range" always;
      add_header Content-Length 0;
      add_header Content-Type text/plain;
      return 204;
    }
  }

  # ── WADO proxy → Orthanc ─────────────────────────────────────
  location /wado {
    proxy_pass http://orthanc:8042/wado;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_read_timeout 300s;
    client_max_body_size 2g;

    add_header Access-Control-Allow-Origin * always;
    add_header Access-Control-Expose-Headers "Content-Length" always;
  }

  # ── SPA OHIF (igual que el original) ─────────────────────────
  location / {
    root   /usr/share/nginx/html;
    index  index.html index.htm;
    try_files $uri $uri/ /index.html;
    add_header Cross-Origin-Resource-Policy same-origin;
    # Permite embeber en iframe desde cualquier origen (para nuestra app React)
    add_header Content-Security-Policy "frame-ancestors *" always;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

  error_page 500 502 503 504 /50x.html;
  location = /50x.html {
    root /usr/share/nginx/html;
  }
}
