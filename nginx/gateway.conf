# ============================================================
# Gateway Nginx — Garvis DICOM
# Contenedor: dicom-gateway (puerto 8088 del VPS)
#
# Maneja todo el tráfico DICOM:
#   /dicom-web/ → Orthanc (DICOMweb QIDO/WADO-RS)
#   /wado       → Orthanc (WADO-URI)
#   /           → OHIF Viewer (SPA)
# ============================================================

server {
    listen 80;
    client_max_body_size 2g;

    # ── app-config.js: forzar no-cache para que siempre sirva el nuestro ────
    location = /app-config.js {
        proxy_pass http://ohif:80/app-config.js;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    # ── DICOMweb proxy → Orthanc ─────────────────────────────────────────────
    location /dicom-web/ {
        proxy_pass http://orthanc:8042/dicom-web/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        client_max_body_size 2g;

        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, Range" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range" always;

        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, Range" always;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }
    }

    # ── WADO-URI proxy → Orthanc ─────────────────────────────────────────────
    location /wado {
        proxy_pass http://orthanc:8042/wado;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 300s;
        client_max_body_size 2g;

        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Expose-Headers "Content-Length" always;
    }

    # ── OHIF SPA ──────────────────────────────────────────────────────────────
    location / {
        proxy_pass http://ohif:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;

        # Permite embeber OHIF en iframe desde garbis.online
        add_header Content-Security-Policy "frame-ancestors https://garbis.online https://*.garbis.online" always;
    }
}
