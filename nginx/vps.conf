# ============================================================
# Nginx VPS — Garvis
# Archivo: /etc/nginx/sites-available/garbis
# Enlace:  ln -s /etc/nginx/sites-available/garbis /etc/nginx/sites-enabled/
#
# Subdominos necesarios (mismo IP del VPS):
#   api.garbis.online  → Express API  (puerto 3001)
#   garbis.online      → Frontend React (dist estático)
#   ohif.garbis.online → OHIF Viewer   (Docker puerto 3000)
#
# SSL (Let's Encrypt):
#   certbot --nginx -d api.garbis.online -d garbis.online -d www.garbis.online -d ohif.garbis.online
# ============================================================

# ────────────────────────────────────────────────────────────
# HTTP → HTTPS (todos los dominios)
# ────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name api.garbis.online garbis.online www.garbis.online ohif.garbis.online;
    return 301 https://$host$request_uri;
}

# ────────────────────────────────────────────────────────────
# API backend (Express)
# ────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name api.garbis.online;

    ssl_certificate     /etc/letsencrypt/live/api.garbis.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.garbis.online/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 2g;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 600s;
    }

}

# ────────────────────────────────────────────────────────────
# OHIF Viewer + DICOMweb gateway (subdominio dedicado)
# El contenedor dicom-gateway escucha en 127.0.0.1:8088
# y maneja internamente: OHIF SPA + /dicom-web/ + /wado
# ────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name ohif.garbis.online;

    ssl_certificate     /etc/letsencrypt/live/ohif.garbis.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ohif.garbis.online/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 2g;

    location / {
        proxy_pass http://127.0.0.1:8088/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
    }
}

# ────────────────────────────────────────────────────────────
# Frontend React (garbis.online)
# ────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name garbis.online www.garbis.online;

    ssl_certificate     /etc/letsencrypt/live/garbis.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/garbis.online/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root /var/www/garvis/dist;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Content-Type-Options nosniff;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
